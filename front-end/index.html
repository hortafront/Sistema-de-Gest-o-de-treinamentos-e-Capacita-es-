<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pagina de login</title>
   <link rel="stylesheet" href="../css/style.css">
</head>
<div class="body">
    <body>
    <div class="h1">
        <h1>Treinamentos e Capacitações</h1>
        <p>Entre para acompanhar seus treinamentos.</p>
    </div>
    <br>
    <div class="login">
        <form action="login">
        <label for="login">Login</label><br>
        <input type="text" id="login" name="login">
    </form>
    </div>
    <br>
    <div class="senha">
           <form action="senha">
        <label for="senha">Senha</label><br>
        <input type="password" id="senha" name="senha">
    </form>
    </div>
    <br>
    <div class="entar como">
        <form action="entar como">
        <label for="entrar como">Entrar como</label>
        <select name="entrar como" id="entrar como">
            <option value="" selected>Funcionario(a)</option>
            <option value="">Gestor(a)</option>
            <option value="">RH</option>
            <option value="">Instrutor</option>
            <option value="">Administrador</option>
        </select>
    </form>
    </div>
   <div class="butao">
     <form action="butao">
        <button type="submit">Entrar</button>
    </form>
    
   </div>
   <script src="../JavaScript/index.js" defer></script>
    
</body>
</div>
</html>
